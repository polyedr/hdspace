name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adevi_db
          POSTGRES_USER: adevi_user
          POSTGRES_PASSWORD: adevi_strong_password_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adevi_user -d adevi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: adevi_db
      DB_USER: adevi_user
      DB_PASSWORD: adevi_strong_password_2024
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      DJANGO_SETTINGS_MODULE: project.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-docker.txt
      - name: Django check and migrate
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: Pytest smoke + core API
        run: |
          pytest tests/smoke tests/api -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint:check
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build staging
        run: npm run build:staging

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    if: false
    # Enable after stack services are available in CI runners.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Run e2e smoke
        working-directory: frontend
        run: npx playwright test
        env:
          FRONTEND_URL: http://localhost:8080
          API_URL: http://localhost:18000
