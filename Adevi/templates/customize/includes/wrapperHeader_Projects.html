{% block content%}
    <div class="row border-bottom">
        <nav id="changeZ-index" class="navbar navbar-static-top white-bg" role="navigation" style="margin-bottom: 0;z-index: 0;min-height: 40px;">
            <div class="navbar-header">
                <a id="maximiserNav" class="navbar-minimalize minimalize-styl-2 btn btn-primary" style="margin-top: 0.65%;visibility: hidden;position: absolute;">
                    <i class="fa fa-bars" style="color:#FFFFFF"></i>
                </a>
                <a id="minimiserNav" class="navbar-minimalize minimalize-styl-2 btn btn-primary" style="margin-top: 0.65%;visibility: visible;position: absolute;">
                    <i class="fa fa-bars" style="color:#FFFFFF"></i>
                </a>
            </div>
            <ul class="nav navbar-top-links navbar-right" style="margin-right:25px;">
                <li class="logout-visibility">
                    {% if user.is_authenticated %}
                    <a class="logout-visibility" href="/logout" style="height:40px; min-height:40px;margin-right: -20px">
                        <button id="buttonChangeURL" class="btn btn-primary btn-sm" style="margin-bottom:0px;margin-right: -5px;margin-top:-14px;">
                            <i class="fa fa-sign-out fa-1x" style="margin-right: -2.5px;color:white;display:inline;"><h4 style="display:inline;"> Logout</h4></i>
                        </button>
                    </a>
                    {% else %}
                    <a class="logout-visibility" href="/login" style="height:40px; min-height:40px;margin-right: -20px">
                         <button class="btn btn-primary btn-sm" style="margin-bottom:0px;margin-right: -5px;margin-top:-6px;">
                            <i class="fa fa-sign-out fa-1x" style="margin-right: -2.5px;color:white"> Login</i>
                        </button>
                    </a>
                    {% endif %}
                </li>
                <li style="margin-right:12px;">
                    <i id="logout" class="fa fa-sign-out fa-1x" style="position: absolute;margin-top: -18px;"></i>
                </li>
            </ul>
        </nav>
    </div>
    <div class="ibox-tools" style="display:none;">
        <div id="suggestionBox">
            <div class="ibox-title col-xs-12" style="width: 780px;height: 298px;background-color: #f3f3f4;
                border-top-style: none;top: 52px;
                left: 279px;
                position: fixed;">
                <div class="ibox-title col-xs-12" style="padding-top: 0;">
                    <div class="ibox-content col-xs-12" style="padding: 0;
                        border-top: none;">
                        <div class="center">
                            <form role="search" class="navbar-form-custom" method="post" action="#" style="margin-bottom: 0;">
                                <div class="form-group">
                                    <input type="text" placeholder="Search for something..." class="form-control"
                                           name="top-search" id="top-search-popedup" style="margin-top: -2%;" onkeyup="keepInputValueSame()">
                                </div>
                            </form>
                            <span style="font-size: 22px;text-transform: none;">Result of the Search</span><br/><br/>
                            <div class="ibox-title col-xs-12" style="padding: 0;padding-top: 10px;">
                                <div class="ibox-content col-xs-12" style="padding: 0;border: none;">
                                </div>
                            </div>
                            <div class="ibox-title col-xs-12" style="padding: 0;padding-top: 10px;">
                                <div class="ibox-content col-xs-12" style="padding: 0;border: none;">
                                    <button type="submit" name="acceptScreenshots" class="btn btn-primary">
                                        Approve
                                    </button>
                                    <button class="btn btn-primary suggestionBox_close">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
