    <script>"use strict";
        //Upload Form Submission
        function uploadScreen(){
            var currentscreen = '';
            $("#changeZ-index").attr('style', 'z-index : 1');
            setTimeout(function(){
                $('#CheckUploadScreen').popup('hide');
            },200);
            $.when(getAllScreen()).done(function(a1) {
                console.log(pagesResult);
                currentscreen = pagesResult;
            });
            swal({
              title: "Enter Screen Name",
              type: "input",
              showCancelButton: false,
              closeOnConfirm: false,
              inputPlaceholder: "Enter text here"
            }, function (inputValue) {
                if (inputValue === false) {
                  document.getElementById('preview1').src ='';
                  return false;
                }
                if (inputValue === "") {
                    swal.showInputError("You need to write something!");
                        return false;
                    }
                    else if (currentscreen.includes(inputValue)){
                        swal.showInputError("This screenshot name already exists. Please choose something different.");
                        return false;
                    }
                else {
                  swal.close();
                  document.getElementById('filenameUS').innerHTML = inputValue;
                  document.getElementById('filenameUS').value = inputValue;
                  {#document.getElementById('myfile').value = inputValue;#}
                  document.getElementById('uploadNewScreenshotFormUS').submit();
                  loadScreen();
                }
            });
        }
    </script>
