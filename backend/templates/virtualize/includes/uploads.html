{% block content%}
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.5.2/jquery.min.js"></script>
<script src="http://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.2/modernizr.js"></script>

    <div class="ibox">
        <div class="row">
          <div class="col-md-7">
              <ul class="fSize14 mt-25">
                    <li>Drawings: .png, .jpg, .jpeg, .gif (icon)
                    </li>
                    <br/>
                    <li>GUI screenshot: .png, .jpg, .jpeg, .gif (icon)
                    </li>
                    <br/>
                    <li>Document (RAD, Scope Document etc): .doc, .docx, *.pdf (doc icon)
                    </li>
                </ul>
          </div>
          <div class="col-md-5">


              <label for="imgUpload">
                  <div class="grey-ibox-upload">
                      <div id="remove-on-click" class="absolute">
                          <i id="remove-fa-download-on-click" class="fa fa-download absolute center-40per"
                             style="font-size:40px;color: grey;" aria-hidden="true"></i>
                          <div id="imgPreview">
                              <img id="imgHide" alt="image" class="img-rate absolute" src="/static/media/img/Upload001.jpg"/>
                              <div id="loader1" class="loader hidden absolute" style="margin-top: 27%;
                                 margin-left: 21%;">
                              </div>
                              <div id="text-upload" class="absolute hidden" style="color:Blue;margin-top: 43%;
                                 margin-left: 10%;font-size:10px"><p>Uploading your Screen shot</p>
                              </div>
                          </div>
                      </div>
                  </div>
                  </label>
                  <div class="center" style="width: 204px">
                      <form  method="POST" enctype="multipart/form-data">
                          {% csrf_token %}
                          <span class="mb-5">Upload your file </span>
                          <input type="file" name="myfile" id="imgUpload" class="input-file"/>
                          <input type="submit" value="Upload"/>
                          <div class="se-pre-con"></div>
                      </form>
                  </div>
          </div>
        </div>
    </div>

<script>
   //paste this code under the head tag or in a separate js file.
   // Wait for window load
   $(window).load(function() {
        // Animate loader off screen
        $(".se-pre-con").fadeOut("slow");;
   });
</script>



<style>
#loader1 {
  border: 5px solid grey;
  border-radius: 50%;
  border-top: 5px solid #3498db;
  width: 50px;
  height: 50px;
  -webkit-animation: spin 0.7s linear infinite;
  animation: spin 0.7s linear infinite;
}

@-webkit-keyframes spin {
  0% { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Paste this css to your style sheet file or under head tag */
/* This only works with JavaScript,
if it's not present, don't show loader */
.no-js #loader { display: none;  }
.js #loader { display: block; position: absolute; left: 100px; top: 0; }
.se-pre-con {
	position: fixed;
	left: 0px;
	top: 0px;
	width: 100%;
	height: 100%;
	z-index: 9999;
	background: url(../static/img/uploaderGif/Preloader_3.gif) center no-repeat #fff;
}

</style>



{% endblock %}
