  <script>
      var moved = false;
      var moveBbox = true;
      var snap = true;
      var tempx = 0, tempy = 0,tempw = 0,temph = 0;

      function alignTool(state, event) {
          document.getElementById('objectx').style.display = 'none';
          document.getElementById('objecty').style.display = 'none';
          var offset = $("#classContainer-selector").offset();

          if (snap ==  true){
              var inst = document.getElementById('classContainer-selector').getElementsByClassName('main');
              //var inst = $(this).data("drag-resize");
              var d = 1;
              var ui = document.getElementById('drag-resizeId');
              var uiheight = ui.height;

              var element = document.getElementById(document.getElementById('test').innerHTML);
              if (element.tagName == "A"|| element.tagName =="P"){
                  uiheight = (parseFloat(uiheight)/100)*125;
              }

              var x0 = ui.left, x1 = x0 + ui.width,
                  y0 = ui.top, y1 = y0 + uiheight,
                  xc = (x0 + x1) / 2, yc = (y0 + y1) / 2;

              for (var i = inst.length - 1; i >= 0; i--) {
                  if (document.getElementById('test').innerHTML != inst[i].id) {
                      var curElm = document.getElementById(document.getElementById('test').innerHTML);
                      var elm = document.getElementById(inst[i].id);
                      var l = parseFloat(window.getComputedStyle(elm, null).getPropertyValue('left'), 10),
                          r = l + parseFloat(window.getComputedStyle(elm, null).getPropertyValue('width'), 10),
                          t = parseFloat(window.getComputedStyle(elm, null).getPropertyValue('top'), 10),
                          b = t + parseFloat(window.getComputedStyle(elm, null).getPropertyValue('height'), 10),
                          hc = (l + r) / 2, vc = (t + b) / 2;

                      var ls = Math.abs(parseFloat(l, 10) - parseFloat(x1, 10)) <= d;
                      var rs = Math.abs(parseFloat(r, 10) - parseFloat(x0, 10)) <= d;
                      var ll = Math.abs(parseFloat(l, 10) - parseFloat(x0, 10)) <= d;
                      var rr = Math.abs(parseFloat(r, 10) - parseFloat(x1, 10)) <= d;

                      var ts = Math.abs(parseFloat(t, 10) - parseFloat(y1, 10)) <= d;
                      var bs = Math.abs(parseFloat(b, 10) - parseFloat(y0, 10)) <= d;
                      var tt = Math.abs(parseFloat(t, 10) - parseFloat(y0, 10)) <= d;
                      var bb = Math.abs(parseFloat(b, 10) - parseFloat(y1, 10)) <= d;


                      var hs = Math.abs(parseInt(hc, 10) - parseInt(xc, 10)) <= d;
                      var vs = Math.abs(parseInt(vc, 10) - parseInt(yc, 10)) <= d;

                      var curMarLeft = (window.getComputedStyle(curElm,null).getPropertyValue('margin-left'));
                      var curMarTop = (window.getComputedStyle(curElm,null).getPropertyValue('margin-top'));

                      // ls is to check RIGHT vertical alignment of selected element against LEFT of any other element
                      if (ls) {
                          document.getElementById('objectx').style.left = l+'px';
                          document.getElementById('objectx').style.display = 'block';

                          if (state == 'mouse') {
                              ui.left = l - curElm.width - curMarLeft;
                              ui.bbox.elmX = l - ui.width;
                              curElm.left = l - ui.width - curMarLeft;
                          }
                      }
                      // rs is to check LEFT vertical alignment of selected element against RIGHT of any other element
                      if (rs) {
                          document.getElementById('objectx').style.left = r+'px';
                          document.getElementById('objectx').style.display = 'block';
                          if (state == 'mouse') {
                              ui.left = r - curMarLeft;
                              ui.bbox.elmX = r;
                              curElm.left = r - curMarLeft;
                          }
                      }
                      // ll is to check LEFT vertical alignment of selected element against LEFT of any other element
                      if (ll) {
                          document.getElementById('objectx').style.left = l+'px';
                          document.getElementById('objectx').style.display = 'block';
                          if (state == 'mouse') {
                              ui.left = l - curMarLeft;
                              ui.bbox.elmX = l;
                              curElm.left = l - curMarLeft;
                          }
                      }
                      // rr is to check RIGHT vertical alignment of selected element against RIGHT of any other element
                      if (rr) {
                          document.getElementById('objectx').style.left = r+'px';
                          document.getElementById('objectx').style.display = 'block';
                          if (state == 'mouse') {
                              ui.left = r - curElm.width - curMarLeft;
                              ui.bbox.elmX = r - ui.width;
                              curElm.left = r -ui.width - curMarLeft;
                          }
                      }

                      // ts is to check BOTTOM vertical alignment of selected element against TOP of any other element
                      if (ts) {
                          document.getElementById('objecty').style.top = t+'px';
                          document.getElementById('objecty').style.display = 'block';
                          if(state=='mouse') {
                              ui.top = t - curElm.height - curMarTop;
                              ui.bbox.elmY = t - uiheight;
                              curElm.top = t - uiheight - curMarTop;
                          }
                      }
                      // bs is to check TOP vertical alignment of selected element against BOTTOM of any other element
                      if (bs) {
                          document.getElementById('objecty').style.top = b+'px';
                          document.getElementById('objecty').style.display = 'block';
                          if(state=='mouse') {
                              ui.top = b - curMarTop;
                              ui.bbox.elmY = b;
                              curElm.top = b - curMarTop;
                          }
                      }
                      // tt is to check TOP vertical alignment of selected element against TOP of any other element
                      if (tt) {
                          document.getElementById('objecty').style.top = t+'px';
                          document.getElementById('objecty').style.display = 'block';
                          if(state=='mouse') {
                              ui.top = t - curMarTop;
                              ui.bbox.elmY = t ;
                              curElm.top = t - curMarTop;
                          }
                      }
                      // bb is to check BOTTOM vertical alignment of selected element against BOTTOM of any other element
                      if (bb) {
                          document.getElementById('objecty').style.top = b+'px';
                          document.getElementById('objecty').style.display = 'block';
                          if(state=='mouse') {
                              ui.top = b - curElm.height - curMarTop;
                              ui.bbox.elmY = b - uiheight;
                              curElm.top = b - uiheight - curMarTop;
                          }
                      }
                      // hs is to check VERTICAL CENTER alignment of selected elemnt against VERTICAL CENTER of any other element
                      if (hs) {
                          document.getElementById('objectx').style.left = hc+'px';
                          document.getElementById('objectx').style.display = 'block';
                          if(state=='mouse') {
                              ui.left = hc - curElm.width / 2;
                              ui.bbox.elmX = hc - ui.width / 2;
                              curElm.left = hc - ui.width / 2;
                          }
                      }
                      // vs is to check HORIZONTAL CENTER alignment of selected elemnt against HORIZONTAL CENTER of any other element
                      if (vs) {
                          document.getElementById('objecty').style.top = vc+'px';
                          document.getElementById('objecty').style.display = 'block';
                          if(state=='mouse') {
                              ui.top = vc - curElm.height / 2;
                              ui.bbox.elmY = vc - uiheight / 2;
                              curElm.top = vc - uiheight / 2;
                          }
                      }
                  }

              }
          }
      }

    /**

     * when the user zoom in.
     *
     * @method setZoom
     * @param {Number} zoom values from 0.1 to 2
     */
    setZoom: function(zoom) {
    	this.zoomLevel = zoom;

    	if (zoom < 0.6) {
	    	this.zoomRatio = 1/zoom;
    		this.displayHandlers(['bm', 'tm', 'mr', 'ml']);
    		this.style.border = '0 none';
    	}
    	else {
    		this.zoomRatio = 1;
    		this.displayHandlers();
	    	this.style.border = '';
    	}
    },

    toggleDebugInfo: function(){

    },

    /**
     * This method returns the floor value from a decimal value.
     *
     * @method ToFloor
     * @param {Number} value The decimal value to compute.
     * @return {Number} the floor value.
     */
    ToFloor: function(value) {
			return value | 0;
		},

    /**
     * This method is used to show all or a subset of the resize handlers.
     *
     * @method displayHandlers
     * @param {Array} filters An array of the handlers to show. If the array is empty or not provided, then all the handlers are shown.
     */
    displayHandlers: function(filters){

    	var handlersContainer = this.$.resizable_handlers;
    	var handlers = [].slice.call(handlersContainer.querySelectorAll('[data-direction]'));

    	if(filters && filters.length>0){

    		// first, hide all
	    	handlers.forEach(function(handler, index, self){
  				handler.style.visibility = 'hidden';
  			});

	    	// show filtered only
    		filters.map(function(filter, index, self){
    			var dom = handlersContainer.querySelector('[data-direction="'+filter+'"]');
    			if(dom){
    				dom.style.visibility = 'visible';
    			}
  				return dom;
  			});

    	}
    	else {
    		// show all
    		handlers.forEach(function(handler, index, self){
  				handler.style.visibility = 'visible';
  			});
    	}
    },

  	/**
  	 * Adgjusts the font size of the resized element.
  	 *
  	 * @method adjustFontSize
  	 * @param  {DOMElement} elem The element whose font size should be adjusted.
  	 */
    adjustFontSize: function(elem){
      var compressor = 3.5;
      var minFontSize = 8;
      var maxFontSize = 100;
      var val = elem.getBoundingClientRects().width / (compressor*10);
      elem.style.fontSize = Math.max(Math.min(val, parseFloat(maxFontSize)), parseFloat(minFontSize));
    },

    /**

     * @param  {Event} event The `ontap` event.
     */
    ontap: function(event){
        var elm = event.target;
	    if (elm.dataset.direction) {
	      this.resizeHandle = elm;
	      if (this.resizeHandle && this.dragstart) {
	        this.dragstart(elm, this.resizeHandle.dataset.direction);
	      }
	    }
	    else {
	    	this.resizeHandle = null;
	    }

	    // Stop mouse selections if we're dragging a handle.
      event.preventDefault();
      event.stopPropagation();
    },

    /**
     * The `ontrack` handler.
     *
     * @method ontrack
     * @param  {Event} event The `ontrack` event.
     */
    ontrack: function(event){

    	var direction;

	    if (this.resizeHandle) {

				direction = this.resizeHandle.dataset.direction;
	    	this.resizeHandleDrag(event.ddx, event.ddy, direction)
	    }

    	this.updateStyle();

	    if (this.dragmove) {
	      this.dragmove(this);
	    }

	    event.stopPropagation();
    	event.preventDefault();

    /**
     * Update either the position or the dimension styling of both the selected element and drag-resize element.
     *
     * @method updateStyle
     * @param {String} updateConfig Pass `'dimension'` to update the dimension values.
     *                              Pass `'position'` to update the position values.
     */
    updateStyle: function(updateConfig){

    	var element = this.selectedElement;

			function updatePosition(){

      	this.left = this.bbox.elmX;
	      this.top = this.bbox.elmY;

	      if(element){
		      element.left = this.left | 0;
		      element.top = this.top | 0;
	      }
      }

      function updateDimension(){

      	this.width = this.bbox.elmW;
	      this.height = this.bbox.elmH;

	      if(element){

		      element.width = this.width | 0;
		      element.height = this.height | 0;
	    	}
      }

			switch(updateConfig){
				case 'dimension':
					updateDimension.apply(this);
					break;

				case 'position':
					updatePosition.apply(this);
					break;

				default:
					updatePosition.apply(this);
					updateDimension.apply(this);
					break;
			}

    },

	    if (direction.indexOf('t') >= 0) {
	      if (this.bbox.elmH - dY < this.minHeight) {
	        diffY = this.bbox.elmH - this.minHeight;
	        this.mouse.offset.y = dY - diffY;
	      } else if (this.bbox.elmY + dY < this.minTop) {
	        diffY = this.minTop - this.bbox.elmY;
	        this.mouse.offset.y = dY - diffY;
	      }
	      this.bbox.elmY += diffY;
	      this.bbox.elmH -= diffY;
	      processed = true;
	    }
	    if (direction.indexOf('b') >= 0) {
	      if (this.bbox.elmH + dY < this.minHeight) {
	        diffY = this.minHeight - this.bbox.elmH;
	        this.mouse.offset.y = dY - diffY;
	      } else if (this.bbox.elmY + this.bbox.elmH + dY > this.maxTop) {
	        diffY = this.maxTop - this.bbox.elmY - this.bbox.elmH;
	        this.mouse.offset.y = dY - diffY;
	      }
	      this.bbox.elmH += diffY;
	      processed = true;
	    }
	    if (direction.indexOf('l') >= 0) {
	      if (this.bbox.elmW - dX < this.minWidth) {
	        diffX = this.bbox.elmW - this.minWidth;
	        this.mouse.offset.x = dX - diffX;
	      } else if (this.bbox.elmX + dX < this.minLeft) {
	        diffX = this.minLeft - this.bbox.elmX;
	        this.mouse.offset.x = dX - diffX;
	      }
	      this.bbox.elmX += diffX;
	      this.bbox.elmW -= diffX;
	      processed = true;
	    }
	    if (direction.indexOf('r') >= 0) {
	      if (this.bbox.elmW + dX < this.minWidth) {
	        diffX = this.minWidth - this.bbox.elmW;
	        this.mouse.offset.x = dX - diffX;
	      } else if (this.bbox.elmX + this.bbox.elmW + dX > this.maxLeft) {
	        diffX = this.maxLeft - this.bbox.elmX - this.bbox.elmW;
	        this.mouse.offset.x = dX - diffX;
	      }
	      this.bbox.elmW += diffX;
	      processed = true;

  	/**

	 /**
      * tl---tm---tr
      * |          |
      * ml         mr
      * |          |
      * bl---bm---br
      */
  	dragging: function(dragInfo){
  	    if (moveBbox == true) {
  	        alignTool('mouse', event);

            var elem = dragInfo.event.target;
            var dir = elem.dataset.direction;

            if(dir == 'tl'){
                this.bbox.elmX = tempx + tempw - this.bbox.elmW;
                this.bbox.elmY = tempy + temph - this.bbox.elmH;
            }
            if(dir == 'tm'){
                this.bbox.elmX = tempx;
                this.bbox.elmY = tempy + temph - this.bbox.elmH;
                this.bbox.elmW = tempw;
            }
            if(dir == 'tr'){
                this.bbox.elmX = tempx;
                this.bbox.elmY = tempy + temph - this.bbox.elmH;
            }
            if(dir == 'ml') {
                this.bbox.elmX = tempx + tempw - this.bbox.elmW;
                this.bbox.elmY = tempy;
                this.bbox.elmH = temph;
            }
            if(dir == 'mr') {
                this.bbox.elmX = tempx;
                this.bbox.elmY = tempy;
                this.bbox.elmH = temph;
            }
            if(dir == 'bl'){
                this.bbox.elmX = tempx + tempw - this.bbox.elmW;
                this.bbox.elmY = tempy;
            }
            if(dir == 'bm'){
                this.bbox.elmX = tempx;
                this.bbox.elmY = tempy;
                this.bbox.elmW = tempw;
            }
            if(dir == 'br'){
                this.bbox.elmX = tempx;
                this.bbox.elmY = tempy;
            }


            var w = document.getElementById('classContainer-selector').offsetWidth;
            var h = document.getElementById('classContainer-selector').offsetHeight;

            moved = true;

            if (this.position().top <= 0) {
                this.bbox.elmY = 0;
            }
            if (this.position().left <= 0) {
                this.bbox.elmX = 0;
            }
            if ((this.position().left + this.width) >= w) {
                this.bbox.elmX = w - this.width;
            }
            if ((this.position().top + this.height) >= h) {
                this.bbox.elmY = h - this.height;
            }

            var element = this.selectedElement;
            var ratio = 1 / this.zoomLevel;
            var ddx = (dragInfo.event.ddx * ratio) | 0;
            var ddy = (dragInfo.event.ddy * ratio) | 0;

            if (element) {

                this.left = this.bbox.elmX + ddx;
                this.top = this.bbox.elmY + ddy;

                if (this.resizeHandle) {
                    this.updateStyle('dimension');
                }
                else {
                    this.bbox.elmX = this.left;
                    this.bbox.elmY = this.top;
                    this.updateStyle('position');
                }
            }

        }

              element.style.top = this.top / heightSection * 100 + '%';

              element.style.top = this.top / heightSection * 100 + '%';
