[pytest]
DJANGO_SETTINGS_MODULE = project.settings.base
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests apps
norecursedirs = site-packages .git __pycache__ *.egg-info dist build node_modules
addopts = 
    -v
    --tb=short
    --reuse-db
markers =
    smoke: Smoke tests (quick sanity checks)
    api: API endpoint tests
    ml: Machine learning tests (may be slow)
    slow: Slow tests
    integration: Integration tests