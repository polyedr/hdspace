{% extends base_template %}


{% block content %}

<table class="body-wrap">
  <tr>
    <td></td>
    <td class="container" width="600">
      <div class="content">
        <table class="main" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td class="content-wrap">
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td class="content-block">
                    <h3>Invitation to collaborate on the "{{ name }}" project</h3>
                  </td>
                </tr>
                <tr>
                  <td class="content-block">
                    Accept or Decline. Click on the button below and follow instructions.
                  </td>
                </tr>
                <tr>
                  <td class="content-block aligncenter">
                    <a href="{{ invite_accept_url }}" class="btn-primary">Accept</a>
                    <a href="{{ invite_decline_url }}" class="btn-primary">Decline</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>
    </td>
    <td></td>
  </tr>
</table>

{% endblock %}
