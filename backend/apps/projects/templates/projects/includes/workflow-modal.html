<div class="modal inmodal" id="workflowModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content animated bounceInRight">
      <div class="modal-body">
        <div class="form-inline">
          <div class="form-group">
            <div class="dropdown">
              <p>ASSIGNED TO</p>
              <button id="assignedUser" class="dropbtn">Assigned</button>
              <div id="collaboratordDropdown" class="dropdown-content" data-url="{% url 'projects:assign_screen' %}">
                <input type="text" placeholder="Search collaborators" id="searchInput" />
                {% for member in project_members %}
                  <a data-assigne="{{ member.user.pk }}">{{ member.user.get_full_name }}</a>
                {% endfor %}
              </div>
            </div>
          </div>
          <div class="form-group status-group">
            <div class="status-dropdown">
              <div class="btncheck">
                  <button id="statusChange" class="statusbtn"></button>
              </div>
              <div id="statusDropdown" class="status-dropdown-content" data-url="{% url 'projects:change_status' %}">
                <ul>
                    <li data-status="on_hold" class="coloGreen"><a>On Hold</a></li>
                    <li data-status="in_progress" class="colorBlue"><a>In Progres</a></li>
                    <li data-status="review" class="colorOrange"><a>Needs Review</a></li>
                    <li data-status="approved" class="colorRed"><a>Approved</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
