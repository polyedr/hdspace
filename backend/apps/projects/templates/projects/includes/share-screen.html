{% load preview_path %}
<div class="modal inmodal" id="shareScreen" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content animated bounceInRight">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                class="sr-only">Close</span></button>
        <i class="fa fa-share-alt modal-icon"></i>
        <span class="modal-title">Share Prototype</span>
      </div>

      <div class="modal-body share-modal">
        <label>Copy this private url to share:</label>
        <div class="form-inline">
          <div class="form-group">
            <input id="shareLink" class="form-control input-group share-link" value="{{ preview_url|preview_path }}">
          </div>
          <button id="copyButton" class="btn btn-success" data-clipboard-target="#shareLink">Copy</button>
        </div>
        <label>Email this private url to share:</label>
        <div class="form-inline">
          <div class="form-group">
            <input id="email_share" class="form-control input-group share-link" name="email_share">
          </div>
          <button class="btn btn-success" id="sharePrototype" data-url="{% url 'projects:share_screen' %}">Send</button>
        </div>

      </div>
    </div>
  </div>
</div>
