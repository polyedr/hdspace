{% load widget_tweaks %}
<div class="modal inmodal" id="screenModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                class="sr-only">Close</span></button>
      </div>
      <form id="modalForm" action="" method="POST">
        <div class="modal-body">
            {% csrf_token %}
            {% for field in form.visible_fields %}
              <div class="form-group">
                <label for="id_{{ field.name }}">{{ field.label }}</label>
                {{ field|add_class:"form-control" }}
                <p class="text-danger validate_error">This field is required.</p>
              </div>
            {% endfor %}
        </div>
        <div class="modal-footer">
          <button type="button" id="modalCloseButton"class="btn btn-white" data-dismiss="modal">Close</button>
          <button type="button" id="modalButton" class="btn btn-primary" data-url="{{ url }}">Save</button>
          <button type="button" id="modalDeleteButton" class="btn btn-warning">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
