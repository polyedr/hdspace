{% load staticfiles %}
<html>
  <head>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/screen.css' %}" rel="stylesheet">
  </head>
  <body>
  <div id="screenImage" class="screenContainer">
      {% if screen.get_image %}
        <img src="{{screen.get_image}}" id="image" class="edited-image" border="0"/>
        {% for screen_event in screen_events %}
          <div
                  class="existed"
                  style='top:{{screen_event.y}}px;
              width:{{screen_event.width}}px;
              left:{{screen_event.x}}px;
              height:{{screen_event.height}}px;'
                  data-href="{{screen_event.href}}"
                  data-x="{{screen_event.x}}"
                  data-y="{{screen_event.y}}"
                  data-width="{{screen_event.width}}"
                  data-height="{{screen_event.height}}"
                  data-event="{{screen_event.event}}"
                  data-link_to="{{screen_event.link_to}}"
                  data-new_window="{{screen_event.new_window}}"
                  data-screen_event_id="{{screen_event.pk}}"
                  data-delete_url="{{screen_event.get_event_delete_url}}"
                  data-update_event_position="{{screen_event.get_update_event_position_url}}">
            <div class="ui-resizable-handle ui-resizable-ne"></div>
            <div class="ui-resizable-handle ui-resizable-se ui-icon ui-icon-gripsmall-diagonal-se"></div>
            <div class="ui-resizable-handle ui-resizable-sw"></div>
            <div class="ui-resizable-handle ui-resizable-nw"></div>
          </div>
        {% endfor %}
    {% endif %}
  </div>
  <div class="bottom-toolbar">
    <div class="container">
      <div class="text-center">
        <div class="btn-group" role="group" aria-label="...">
          <button type="button" class="btn btn-link btn-lg">
            <span class="glyphicon glyphicon-eye-open"></span>
          </button>
          <button type="button" class="btn btn-link btn-lg">
            <span class="glyphicon glyphicon-picture"></span>
          </button>
          <button type="button" class="btn btn-link btn-lg">
            <span class="glyphicon glyphicon-share-alt"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="adjacent-content">
    <div class="ui-resizable-handle special-index-z ui-resizable-ne"></div>
    <div class="ui-resizable-handle special-index-z ui-resizable-se ui-icon ui-icon-gripsmall-diagonal-se"></div>
    <div class="ui-resizable-handle special-index-z ui-resizable-sw"></div>
    <div class="ui-resizable-handle special-index-z ui-resizable-nw"></div>
  </div>
  {% include "projects/includes/screen.html" with form=screen_form  url=screen.get_screen_url select_screens=screens %}
  <script type="text/javascript">
    window.csrftoken = '{{ csrf_token }}';
  </script>
  <script src="{% static 'js/jquery-3.1.1.min.js' %}"></script>
  <script src="{% static 'js/plugins/jquery-ui.min.js' %}"></script>
  <script src="{% static 'js/plugins/toastr.min.js' %}"></script>
  <script src="{% static 'js/bootstrap.min.js' %}"></script>
  <script src="{% static 'js/scripts.js' %}"></script>
  <script src="{% static 'js/screen-edit.js' %}"></script>
  </body>
</html>
