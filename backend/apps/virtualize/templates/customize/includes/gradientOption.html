            <script type="text/javascript">
                updateBGC();
                var gp = new Grapick({
                    el: '#grapick',
                    colorEl: '<input id="gradientColorpicker"/>',
                    direction: 'to right',
                    min: 1,
                    max: 99
                });
                gp.setColorPicker(function(handler) {
                    var el = handler.getEl().querySelector('#gradientColorpicker');
                    $(el).spectrum({
                        preferredFormat: "rgb",
                        showInitial: true,
                        showInput: true,
                        replacerClassName: 'gradientColorpicker-replacer',
                        showAlpha: true,
                        color: gp.getSafeValue(),
                        move: function (color) {
                            updateColorGradient(color, 'background');
                            handler.setColor(color.toRgbString());
                            console.log('color Gradient Move');
                            console.log(color);
                        },
                        hide: function (color) {
                            updateColorGradient(color, 'background');
                            handler.setColor(color.toRgbString());
                            console.log('color Gradient Hide');
                            console.log(color);
                        }
                    });
                });
                function updateBGC() {
                    $.ajax({
                        type: 'GET',
                        url: 'index',
                        name: 'getBackgroundImageGradient',
                        data: {
                            'name': 'getBackgroundImageGradient'
                        },
                        success: function (data) {
                            var pagesResult, getRgbFH, getRgbaFH, getRgbaFH1, getColValueFH, getPosValueFH, getColValueFHF, rgbaString,
                                foundRGBA, subLengthByOne, getSPP, i, num, trueState, classN, array = [];
                            pagesResult = data;
                            //Split Color string by RGB
                            getRgbFH = data.split('rgb');
                            getRgbaFH = data.replace('-webkit-radial', 'linear')
                                            .replace('center center', 'to right')
                                            .replace('top center', 'to right')
                                            .replace('bottom center', 'to right')
                                            .replace('left center', 'to right')
                                            .replace('right center', 'to right');
                            //Create required number of handlers
                            rgbaString = data;
                            console.log('getRGBA');
                            console.log(getRgbFH.length);
                            subLengthByOne = (getRgbFH.length);
                            for (i = 0; i < subLengthByOne; i++) {
                                console.log(i);
                                console.log('for getRgbFH');
                                console.log(getRgbFH[i]);
                                getColValueFH = getRgbFH[i].split(')');
                                console.log('getColValueFH');
                                console.log(getColValueFH);
                                num = 0;
                                if (i === num) {
                                    console.log('Nothing to do!')
                                } else {
                                    getPosValueFH = getColValueFH[1].split('%');
                                    //Pass variable to added handler
                                    console.log('getPosValueFH');
                                    console.log(getPosValueFH);
                                    getColValueFHF = 'rgb' + getColValueFH[0] + ')';
                                    foundRGBA = /rgb/i.test(rgbaString);
                                    trueState = true;
                                    if (foundRGBA === trueState) {
                                        $('#sq-1').attr('style', 'background-color:' + getColValueFHF);
                                        console.log('getColValueFHF');
                                        console.log(getColValueFHF);
                                        array.push(getColValueFHF);
                                        console.log('array');
                                        console.log(array[0]);
                                        console.log(array[1]);
                                        if (array[0] === array[1]) {
                                            console.log('if');
                                            $('.grp-preview').attr('style', 'background:' + array[0]);
                                            break;
                                        }
                                        else {
                                            console.log('else');
                                            $('.grp-preview').attr('style', 'background:' + getRgbaFH);
                                            gp.addHandler(getPosValueFH[0], getColValueFHF);
                                        }
                                    }
                                    else {
                                        console.log('False, No handler created');
                                    }
                                }
                            }
                            console.log('óutside the for loop');
                            console.log(getColValueFHF);
                        },
                        error: function (jqXHR, status, err) {
                            console.log(jqXHR.responseText);
                        }
                    });
                }
                gp.on('change', function(complete) {
                    var getAllClassContainer, cl, getAllClassContainerW, i, w, changeColor, getStyle;
                    getAllClassContainer = $('#classContainer-selector');
                    cl = getAllClassContainer[0].getAttribute('class');
                    $('#classContainer-selector').attr('style', 'background:' + gp.getSafeValue());
                    $('#classContainer-selectorPro').attr('style', 'background:' + gp.getSafeValue());
                    $('#sq-1').attr('style', 'background:' + gp.getSafeValue());
                    getAllClassContainerW = document.getElementsByClassName(cl);
                    console.log('Display all Work container');
                    console.log(gp.getSafeValue());
                    for (i=0; i<getAllClassContainerW.length;i++){
                        w = getAllClassContainerW[i].getAttribute('class');
                        if(cl === w)  {
                            changeColor = getAllClassContainerW[i].setAttribute('style', 'background:' + gp.getSafeValue());
                            getStyle = getAllClassContainerW[i].getAttribute('style');
                            console.log(getStyle);
                        }

                    }
                });
                gp.emit('change');
                $('#gradientModes li').on('click',function () {
                    var gradtype=$(this).attr('value');
                    gp.setType(gradtype);
                    $('#gradModetxt').text(gradtype + " ");
                });
                $('#gradianAngleModes li').on('click',function () {
                    var gradAngle=$(this).attr('value');
                    gp.setDirection(gradAngle);
                    $('#gradAngletxt').text(gradAngle);
                });
                function testfuntionsupun() {
                    var getAttrOfColor;
                    getAttrOfColor = $('#classContainer-selector').css('background-image');
                    console.log('getAttrOfColor_Test');
                    console.log(getAttrOfColor);
                    changeBackgroundGradient(getAttrOfColor);
                }
            </script>
            <script>
                $(document).ready(function(){
                    var closeButton, getSPP, i;
                    closeButton = $('#grapick').find('.grp-handler-close');
                    for(i=0; i<closeButton.length; i++){
                        closeButton[i].setAttribute('onclick', 'getBGCG()');
                    }
                });
                function getBGCG(){
                    var getAllHandlers, i, getHandlersLength, numF=0, numS=1;
                    console.log('Clikeedd On Close');
                    getAllHandlers = $('#grapick').find('.grp-handler');
                    getHandlersLength = getAllHandlers.length;
                    console.log('getAllHandlers');
                    console.log(getAllHandlers.length);
                    if(getHandlersLength === numS){
                        setTimeout(function(){
                            var color = $('.grp-preview').css('background-image');
                            console.log('color Inside the settime');
                            console.log(color);
                            $.ajax({
                                type: 'POST',
                                url: '/index/',
                                name: 'storeHandlerColor',
                                data: {
                                    'name': 'storeHandlerColor',
                                    'color': color
                                }
                            })
                        },1000)
                    }
                    else if(getHandlersLength === numF){
                        swal('Warning: Last Handler, so resetting the handler to default');
                        $.ajax({
                            type: 'GET',
                            url: '/index/',
                            name: 'getHandlerBGC',
                            data: {
                                'name': 'getHandlerBGC'
                            },
                            success: function(data){
                                var getRgbFH,getLinearForRgbFH, getColValueFH,  getPosValueFH, getColValueFHF;
                                pagesResult = data;
                                //First Handler's Color and Position
                                console.log('data');
                                console.log(data);
                                getRgbFH = data.split('rgb');
                                getColValueFH = getRgbFH[1].split(')');
                                console.log(getColValueFH);
                                getPosValueFH = getColValueFH[1].split('%');
                                console.log(getPosValueFH);
                                //Pass variable to added handler
                                getColValueFHF = 'rgb' + getColValueFH[0] + ')';
                                console.log('getColValueFHF');
                                console.log(getColValueFHF);
                                gp.addHandler(getPosValueFH[0], getColValueFHF, 0);
                                //Set Linear Gradient Options
                                getLinearForRgbFH = data.split('(');
                                console.log('getLinearForRgbFH');
                                console.log(getLinearForRgbFH);
                                $('.grp-preview').attr('style', 'background: linear-gradient(to right, rgb(' + getLinearForRgbFH[2] + '(' + getLinearForRgbFH[3]);
                                updateColorGradient(getColValueFHF, 'background');
                                setTimeout(function(){
                                    var $closeButton = $('#grapick').find('.grp-handler-close');
                                    for(var i=0; i<$closeButton.length; i++){
                                        $closeButton[i].setAttribute('onclick', 'getBGCG()');
                                    }
                                },1000);
                            },
                            error: function(jqXHR, status, err){
                                console.log(jqXHR.responseText);
                            }
                        });
                    }
                    for(i=0; i<getAllHandlers.length; i++){
                        console.log('for loop');
                    }
                }
            </script>
            <script>
                function addCloseFuButton(){
                    var closeButton, i;
                    console.log('i am executed addCloseFuButton');
                    setTimeout(function(){
                        closeButton = $('#grapick').find('.grp-handler-close');
                        for(i=0; i<closeButton.length; i++){
                            closeButton[i].setAttribute('onclick', 'getBGCG()');
                        }
