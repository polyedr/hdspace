
     <div class="ibox-title col-xs-12" style="background-color: #2f4050; border: none; border-radius: 5px; overflow: hidden;padding-bottom: 0px;">
         <div class="container-lib">
             <div class="grid">
                 <div class="row" style="margin-top:0; text-align: center;">
                    <div class="row" style="height: 100%;">
                        <!-- image gallery -->
                        <div id="gallary-tab-container" class="col-xs-12" >
                            <div id="tabs-lib" class="tabs-container" >
                                <ul class="nav nav-tabs" style="border-bottom: none;">
                                    <li class="active" style="width: 200px;border-right-width: 0;margin-bottom: 1px;" id="projectAssets"><a id="project_asset_tab" data-toggle="tab" onclick="" style="border-right-width:0;border-radius: 5px;"><span>Project Assets</span></a></li>
                                    <li class="" style="width: 200px;border-left-width: 0;margin-left: 1px;" id="accountAssets"><a id="account_asset_tab" data-toggle="tab" onclick="" style="border-left-width:0;border-radius: 5px;"><span>Account Assets</span></a></li>
                                    <li class="" style="width: 200px;margin-bottom: 1px;" id="galleryAssets"><a id="gallary_tab" data-toggle="tab" onclick="" style="border-radius: 5px;"><span>Gallery Assets</span></a></li>
                                    <li class="center" style="width: 51px;float: right;" onclick="closeLibrary()">
                                        <b id="gallary_tab" class="colorHover" style="border-radius: 5px;padding-right: 0;padding-left: 0;">
                                            <button class="btn btn-primary btn-xs" >
                                                Cancel
                                            </button>
                                        </b>
                                    </li>
                                </ul>

                                <div class="tab-content-lib ibox-content" style="padding:0;border-radius: 5px;border-color: #495e71;height: 500px">
                                    <!--file explorer-->
                                    <div class="file-explorer col-xs-3" style="height:100%;padding:7px 0;background-color: #2f4050;">

                                        <div id="buildTree" class="col-xs-12" style="padding: 0;">

                                        </div>
                                    </div>
                                    <!--file viewer-->
                                    <div class=" file-viewer col-xs-9" style="border-left:1px solid;border-color:#495e71;height:100%; padding:0;background-color: #2f4050;min-height: 695px;">
                                          <!--add item-->
                                        <div class="add-item " style="height:40px;padding:10px;float:left;">
                                             <span id="selectAll"  style=" display: inline-block;margin-right: 5px;">
                                                <input id="selectAllChecbox" type="checkbox" name="" value=""> Select All<br>
                                            </span>
                                            <span id="add-asset" data-toggle="collapse" data-target="#resource" onclick="sortImageByNamedesDummy()">
                                                <i class="fa fa-plus" style="margin-right:5px"></i>
                                                NEW ASSET
                                            </span>
                                            <span id="add-frm-web" style="margin-left: 25px;" onclick="addImageToImagaContainerDummy()">
                                                <i class="fa fa-plus" style="margin-right:5px"></i>
                                                ADD FROM WEB
                                            </span>

                                        </div>
                                          <!--option for library-->
                                          <!--sort list-->
                                        <div class="sort-list" >
                                             <span  class="sort-span" >
                                                 <b >
                                                     <input type='radio' value='1' name='radio' id='rad-name'/>
                                                     <label for='rad-name'>Name </label>
                                                 </b>
                                             </span>
                                             <span class="sort-span">
                                                 <b>
                                                     <input type='radio' value='2' name='radio' id='rad-type'/>
                                                     <label for='rad-type'>Type </label>
                                                 </b>
                                             </span>
                                             <span  class="sort-span" onclick="deleteMultipleImages()" >
                                                 <b>
                                                     <input type='radio' value='3' name='radio' id='rad-size'/>
                                                     <label for='rad-size'>Size </label>
                                                 </b>
                                             </span>
                                             <span  class="sort-span">
                                                 <b>
                                                    <input type='radio' value='4' name='radio' id='rad-modified'/>
                                                    <label for='rad-modified'>modified </label>
                                                 </b>
                                             </span>
                                             <span id="view1" class="sort-span">
                                                 <b>
                                                     <input type='radio' value='5' name='radview' id='rad-listView'/>
                                                     <label for='rad-listView'>
                                                         <i class="fa fa-bars fa-1g" ></i>
                                                     </label>
                                                 </b>
                                             </span>
                                            <span id="view2" class="sort-span">
                                                <b>
                                                    <input type='radio' value='6' name='radview' id='rad-thumbView'/>
                                                     <label for='rad-thumbView'>
                                                         <i class="fa fa-th-large"></i>
                                                     </label>
                                                </b>
                                            </span>
                                        </div>
                                        <!--resource upload conatianer-->
                                        <div class="resourceUploadContainer col-xs-12 collapse" id="resource" style="padding: 0px;">
                                           <div class="uploadChooser ibox" style="padding: 0px;background-color: #2f4050;">
                                               <div class="ibox-content col-xs-12" style="padding: 15px;background-color: #2f4050;border:none;">
                                                    <div class="center col-xs-3" id="uploadResourceDisplay" style="height: 185.75px;padding: 0 15px 0 0">
                                                        <div class="tab-content" style=" height: 100%; width: 100%;">
                                                            <div class="tabs-container ui-sortable-handle" style="height: 191px;">
                                                                <div id="" class="tab-pane active" style="height: 100%;">
                                                                     <div class="panel-body" style="padding:0%;border:none;height:100%;background-color: #beebff14;">
                                                                        <div class="grey-ibox-upload">
                                                                            <div id="imgPreviewResource"  style="padding:0%;height:100%;" onclick=""></div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="center col-xs-9" id="uploadResourcebtn" style="height: 185.75px;padding:0;">
                                                        <div class="tab-content" style="
                                                            height: 100%;
                                                            width: 100%;">
                                                            <div class="tabs-container ui-sortable-handle" style="height: 191px;">
                                                                <div id="" class="tab-pane active" style="height: 100%;">
                                                                    <div class="panel-body" style="padding:0%;height:100%;border:none;background-color: #beebff14;">
                                                                        <label for="uploadResourceFile"  style="width: 100%;height: 100%;cursor: pointer;margin: 0%;">
                                                                            <div class="grey-ibox-upload">
                                                                                <div id="remove-on-click-resource" class="" style="left: 0%;top: 0%;right: 0%;bottom: 0%;">
                                                                                    <div id="upload-visibility-resource" class="" style="z-index: 10;">
                                                                                        <i id="remove-fa-download-resource-on-click" class="fa fa-upload absolute w3-display-middle" style="font-size:235%; color: #b5b4b4; z-index: 50" aria-hidden="true"></i>
                                                                                    </div>
                                                                                   <!--<img id="imgHide" alt="image" style="width: 100%;height: 100%;opacity: 0.1;" src="/static/media/img/Upload001.jpg">-->
                                                                                </div>
                                                                                <form id="uploadImgResource" action="#uploaded" method="POST" enctype="multipart/form-data" style="margin: 0;">
                                                                                    {% csrf_token %}
                                                                                    <input type="hidden" name="csrfmiddlewaretoken" value="RUa9jp8t2JEBQihtQPfisWXRY5G9b7sYIkMd0gzm4LupB8cwJcDrVJoa9Hi6RP7e">
                                                                                    <input type="file" accept="image/*" name="myResourcefile" id='uploadResourceFile' class="input-file">
                                                                                    <input type="hidden" name="resourceFilename" id="filenameResource">
                                                                                    <input type="hidden" name="projectuploadResource" id="projectuploadnameResource">
                                                                                    <input type="hidden" name="typeLIB" id="fileTypeLIB">
                                                                                    <input type="hidden" name="sizeLIB" id="fileSixeLIB">
                                                                                    <input type="hidden" name="lastModifiedLIB" id="fileLastMLIB">
                                                                                </form>
                                                                            </div>
                                                                        </label>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                           </div>
                                        </div>
                                        <!--resource  conatianer-->
                                        <div class="resourceContainer col-xs-12" style="padding: 0px">
                                            <div class="ibox " style="padding: 0 15px;background-color: #2f4050;height: 309px;">
                                                <div class="ibox-title"  style="text-align:center;padding: 15px;border:none;background-color: #beebff14">
                                                    <span id="imageLibraryProject" style="text-transform:none;color: #18a689;">{{ projectName }}</span>
                                                </div>
                                                <div class="ibox-content" id="imgSortContainter"  style="height:100%;border-width: 1px;border-style: solid;border-color: #2f405087;background-color: #2f4050;overflow-y: auto;min-height: 600px" >
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>
             </div>
         </div>
     </div>
