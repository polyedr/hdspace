{% for each_message in allMessages %}
<div class="media task" style="padding:15px;padding-bottom:0;padding-left:0;" >
    <a class="testTask" style="width:12px;color:#c1c1c1;display:table-cell;" onclick="selectMessage(this)"><i class="fa fa-check" style="color:inherit"></i></a>
    <div class="media-body">
        <div class="panel-default">

            <div class="panel-body bg-gray-dark text-white b-r-a-3">
                <span>{{each_message.message}}</span>
            </div>
        </div>
        <h6 class="m-t-1"><span>{{ fromName }}</span> <span>- Principal</span>  <span style="float:right;"> {{each_message.created_at}}</span></h6>

    </div>
    <div class="media-right">
        <div class="avatar avatar-image avatar-sm loaded">
             <img  alt="Avatar" class="media-object img-circle" src="/static/users/{{ fromImage }}?{% now "U" %}"
                                        onerror="this.src='/static/users/guest.png'" style="object-fit: cover;
                                        width: 50px;
                                        height: 50px;">
            <i class="avatar-status avatar-status-bottom bg-warning b-brand-gray-darker"></i>
        </div>
    </div>
</div>
{% endfor %}
