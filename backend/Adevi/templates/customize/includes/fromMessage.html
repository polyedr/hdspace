<div class="media m-b-0 task" style="padding-right:15px;padding-left:0;">
    <a class="testTask" style="width:12px;color:#c1c1c1;display:table-cell;" onclick="selectMessage(this)"><i class="fa fa-check" style="color:inherit"></i></a>
    <div class="media-body">
        <div class="panel-default">
            <div class="panel-body bg-primary text-white b-r-a-3">
                {% if uploaded_file_url %}
                    <span>
                        <a href="{{ uploaded_file_url }}" target="_blank">
                            {% if fileExt == '.pdf' %}
                                <img src="/static/users/pdf.jpeg" class="media-object" style="object-fit: cover;" width="50" height="50">
                            {% elif fileExt == '.zip' %}
                                <img src="/static/users/zip.png" class="media-object" style="object-fit: cover;" width="50" height="50">
                            {% elif fileExt == '.txt' %}
                                <img src="/static/users/txt.png" class="media-object" style="object-fit: cover;" width="50" height="50">
                            {% else %}
                                <img src="{{uploaded_file_url}}" class="media-object" style="object-fit: cover;" width="50" height="50">
                            {% endif %}
                        </a>
                    </span>
                {% else %}
                <span>{{message}}</span>
                {% endif %}
            </div>
        </div>
        <h6 class="m-t-1"><span>{{from.firstName}} {{from.lastName}} </span>  <span>- Specialist</span> <span style="float:right;"> {{each_message.created_at}}</span></h6>
    </div>
    <div class="media-right">
        <div class="avatar avatar-image avatar-sm loaded">
            <img  alt="Avatar" class="media-object img-circle" src="/static/users/{{ fromImage }}?{% now "U" %}"
                                        onerror="this.src='/static/img/nopicyet.png'" style="object-fit: cover;
                                        width: 50px;
                                        height: 50px;">

            
            <i class="avatar-status avatar-status-bottom bg-danger b-brand-gray-darker"></i>
        </div>
    </div>
</div>
