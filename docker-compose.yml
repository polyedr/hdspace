version: "2"

services:
  project_img:
    build: .
    image: project_image:latest

  project_app:
    image: project_image:latest
    volumes:
      - .:/project

  db:
    image: mongo:latest
    env_file: .env
    volumes:
      - db:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "27017:27018"

  mailhog:
    image: mailhog/mailhog
    ports:
    - "1025:1025"
    - "8025:8025"

  redis:
    image: redis:3.2
    volumes:
      - redis:/data

  celery:
    extends: project_app
    depends_on:
      - db
      - redis
    command: ./wait-for-it.sh db:27017 -- celery -A project worker -l info
    environment:
      C_FORCE_ROOT: "1"

  project:
    extends: project_app
    depends_on:
      - db
      - mailhog
      - redis
      - celery
    command: ./wait-for-it.sh db:27017 -- python manage.py runserver 0:8000
    ports:
      - "8000:8000"

  packages:
    extends: project_app
    volumes:
      - .:/host

volumes:
  db:
  redis: