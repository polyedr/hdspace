image: node:lts-alpine3.11

pipelines:
  pull-requests:
    '**':
    - step:
        script:
            - npm install
            - npm run lint:fix
            - npm run test
            - npm run build:staging
  branches:
    master:
      - step:
          name: Build
          script:
            - npm install && npm run build:staging
          artifacts:
            - dist/**
      - step:
          name: Deploy to Firebase staging
          deployment: staging
          script:
            - export NODE_ENV=development
            - pipe: atlassian/firebase-deploy:0.2.4
              variables:
                FIREBASE_TOKEN: $FIREBASE_TOKEN
                PROJECT_ID: $FIREBASE_PROJECT_STAGING
    production:
      - step:
          name: Build
          script:
            - npm install && npm run build:production
          artifacts:
            - dist/**

      - step:
          name: Deploy to Firebase production
          deployment: production
          script:
            - export NODE_ENV=production
            - export PORT=80
            - pipe: atlassian/firebase-deploy:0.2.4
              variables:
                FIREBASE_TOKEN: $FIREBASE_TOKEN
                PROJECT_ID: $FIREBASE_PROJECT_PROD
