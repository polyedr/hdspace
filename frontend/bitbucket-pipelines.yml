image: node:lts-alpine

pipelines:
  branches:
    master:
      - step:
          name: Build
          script:
            - npm install && npm run build
          artifacts:
            - dist/**

      - step:
          name: Deploy to Firebase
          deployment: staging
          script:
            - pipe: atlassian/firebase-deploy:0.2.4
              variables:
                FIREBASE_TOKEN: $FIREBASE_TOKEN
                PROJECT_ID: $FIREBASE_PROJECT
