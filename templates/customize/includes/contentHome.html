    <script>
        $(document).ready(function(){
            var identifyCurrentScreen, currentPage, imageName, i, findAllPageName, internal, noOfTimes, display, findAllImage, noOfScreen, timesRun = 0;
            var prjname= document.getElementById("projectName").innerHTML;
            if(!prjname) {
                $('#loadingSubmitPage').css("display","none");
                swal({
                    title: "Enter Project Name",
                    type: "input",
                    showCancelButton: false,
                    closeOnConfirm: false,
                    allowEscapeKey: false,
                    closeOnClickOutside: false,
                    inputPlaceholder: "Enter text here"
                }, function (inputValue) {
                    if (inputValue === false) return false;
                    if (inputValue === "") {
                        swal.showInputError("You need to write something!");
                        return false
                    }
                    else {
                    swal.close();
                        document.getElementById('newprojectname').innerHTML = inputValue;
                        document.getElementById('newprojectname').value = inputValue;
                        document.getElementById('uploadNewProjectName').submit();
                        //swal("Nice!", "You wrote: " + inputValue, "success");
                        loadScreen();
                    }
                    setTimeout(function () {
                        $("#newprojectname").focus();
                    }, 100);
                    $('#my_popup_project').popup('show');
                    function uploadProjectName() {
                        document.getElementById('newprojectname').style.display = '';
                        document.getElementById('newscreenname').style.display = 'none';


                        document.getElementById('newprojectname').focus();
                        var project = document.getElementById('newprojectname').value;
                        if (project === null || project == '') {
                        return false;
                        }
                        else {
                        $('#my_popup_project').popup('hide');
                        loadScreen();
                        }
                    }
                });
            }
            //Check if Screenshots existence, else pop-up to upload screen
            noOfScreen = $('#datatables-example-design').find('h4').length;
            if (noOfScreen === 0 && prjname){
                $('#loadingSubmitPage').css("display","none");
                $('#CheckUploadScreen').popup({ escape: false, blur: false, autoopen: true });
                intervalLoop();
                function intervalLoop(){
                    console.log('interval function');
                    internal = setInterval(function(){
                        timesRun += 1;
                        noOfTimes = 50;
                        $('#CheckUploadScreen_background').attr('style', 'opacity: 0.95;visibility: visible;background-color: rgb(0, 0, 0);position: fixed;top: 0px;right: 0px;bottom: 0px;left: 0px;z-index: 100000;');
                        console.log('interval timer');
                        if(timesRun === noOfTimes){
                            clearInterval(internal);
                            console.log('interval function else')
                        }
                    },1);
                }
            }
            //Check if selected page is a Working Page in device container
            currentPage = $('#retrieveCurrentPage').html();
            findAllPageName = $('#datatables-example').find('.checkImageNameScreenshotSelector');
            findAllImage = $('#datatables-example').find('.imageOutliner');
            console.log(currentPage);
            for(i = 0;i < findAllPageName.length;i++) {
                imageName = findAllPageName[i].innerHTML;
                console.log(imageName);
                console.log('I am checking if the current screen exists!');
                if (currentPage.toLowerCase() === imageName.toLowerCase()){
                    console.log('This is a current Screen');
                    findAllImage[i].setAttribute('class', 'changeBorderOfScreen');
                    identifyCurrentScreen = findAllImage[i].className;
                    console.log(identifyCurrentScreen);
                    display = findAllImage[i].getAttribute('src');
                    console.log(display);
                    findAllImage[i].setAttribute('style', 'border: 2px solid purple;');
                }else {
                    console.log('No Current Screen');
                }
            }
        });
        var gmid, glistOfScreens = [], screens = [];
        function popupScreenSelector(){
            $(document).ready(function () {
                //Check if only one screen exists
                var noOfScreen = $('#datatables-example-design').find('h4').length;
                if (noOfScreen === 1 ){
                    var timer = 2, // timer in seconds
                    isTimerStarted = false;
                    (function customSwal() {
                        swal({
                            title: "Upload 1 more Screen for this option",
                            text: "Closing in " + timer + " seconds...",
                            timer: !isTimerStarted ? timer * 1000 : undefined,
                            showConfirmButton: false
                        });
                        isTimerStarted = true;
                        if(timer) {
                            timer--;
                            setTimeout(customSwal, 1000);
                        }
                    })();
                }
                else if (noOfScreen > 1){
                    $('#ScreenSelectorBox').popup({ escape: false, blur: false, autoopen: true });
                    intervalCUS();
                    function intervalCUS(){
                        var internal, timesRun = 0, noOfTimes;
                        internal = setInterval(function(){
                            timesRun += 1;
                            noOfTimes = 50;
                            $('#ScreenSelectorBox_background').attr('style', 'opacity: 0.95;visibility: visible;background-color: rgb(0, 0, 0);position: fixed;top: 0px;right: 0px;bottom: 0px;left: 0px;z-index: 100000;');
                            if(timesRun === noOfTimes){
                                clearInterval(internal);
                            }
                        },1);
                    }
                    $('#keepPopUpOpen').removeClass('open');
                }
            });
        }

        function selectorTransferNext(){
            var midTag = $('h4').closest('.currentlyChecked').find('h4');
            console.log("mid bhim");
            console.log(midTag);
            console.log(midTag[0].innerText);
            var mid = midTag[0].innerText;
            setMasterscreenshot(mid);

            $('#changeTitleDesign').html('Select The Screens To Transfer Design To');
            $('.defaultDesign').addClass('hidden');
            $('.Design').removeClass('hidden');
            $('#btnIdNext').addClass('hidden');
            $('#btnIdBack').removeClass('hidden');
            $('#btnIdSelectAll').removeClass('hidden');
            checkIfAllScChecked();
        }

        function selectorTransferBack(){
            $('.currentlyChecked').removeClass('hidden');
            $('#changeTitleDesign').html('Select The Master Screen');

            $('#btnIdBack').addClass('hidden');
            $('#btnIdApply').addClass('hidden');
            $('#btnIdSelectAll').addClass('hidden');
            $('#btnIdDeselectAll').addClass('hidden');
        }

        function selectorTransferSelectAll() {

            $('#datatables-example-design').find('.imageDesignScreen').attr('style', 'max-height: 136px; max-width: 100px; margin: 0;opacity:0.5;border: 2px solid orange;width: 100%;height: auto;');
            $('#datatables-example-design').find('.CidDesignToScreen').attr('style', 'position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b400;border-radius: 50%;cursor:pointer;visibility:visible');

            $('#btnIdDeselectAll').removeClass('hidden');

        function selectorTransferDeselectAll(){
            $('#datatables-example-design').find('.CisDesignToScreen').attr('style', 'position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;visibility:visible');

            $('#btnIdSelectAll').removeClass('hidden');

        function setMasterscreenshot(msid){
            gmid = msid;
        }
        function getMasterScreenshot(){
            return gmid;
        }
        function setListofScreens(listScreens){
            glistOfScreens = listScreens;
        }
        function getListofScreens(){
            return glistOfScreens;
        }

        function selectorTransferApply(){
            //Add functions for submitting the selected screen(May need a form in html)
            // need id of masterscreenshot and
            var mid = getMasterScreenshot().toLowerCase();
            // list of screenshot to be transfered
            var tdTag = $('#ScreenSelectorBox').find('td');
            var h4 = $('.CheckedSTD').find('ul').find('h4');
            for(var i=0,j=0;i<tdTag.length;i++){
                var screenStyle = tdTag[i].className;
                if(screenStyle === 'ui-sortable-handle CheckedSTD'){
                    addH4(h4[j].innerText);
                    j++;
                }
            }
            setListofScreens(screens);
            screens = [];
            var listOfScreens = getListofScreens();
            console.log('listOfScreens');
            console.log(listOfScreens);
            console.log("mid in selectorTransferApply fn");
            console.log(mid);
            // getting the values of the checked items
            var bool_colors = document.getElementById('colorsAD').checked;
            var bool_styles = document.getElementById('stylesAD').checked;
            console.log("colors: "+ bool_colors);
            console.log("styles: "+ bool_styles);

            // both colors and styles are checked
            if(bool_colors && bool_styles){
                $.ajax({
                    type: 'POST',
                    url: '/index/',
                    name: 'colorsAD',
                    dataType: 'json',
                    data: {
                            'colorsAD' : 'colorsAD',
                            'color' : bool_colors,
                            'style' : bool_styles,
                            'mid': mid,
                            'screensTD': JSON.stringify(listOfScreens)
                    },
                    success: function (data) {
{#                        window.location.reload();#}
                    }
                });
            }
            // only colors checkbox is checked
            else if(bool_colors){
                $.ajax({
                    type: 'POST',
                    url: '/index/',
                    name: 'colorsAD',
                    dataType: 'json',
                    data: {
                            'colorsAD' : 'colorsAD',
                            'color' : bool_colors,
                            'style' : 'False',
                            'mid': mid,
                            'screensTD': JSON.stringify(listOfScreens)
                    },
                    success: function (data) {
{#                        window.location.reload();#}
                    }
                });
            }
            // only styles checkbox is checked
            else if(bool_styles){
                $.ajax({
                    type: 'POST',
                    url: '/index/',
                    name: 'colorsAD',
                    dataType: 'json',
                    data: {
                            'colorsAD' : 'colorsAD',
                            'color' : 'False',
                            'style' : bool_styles,
                            'mid': mid,
                            'screensTD': JSON.stringify(listOfScreens)
                    },
                    success: function (data) {
{#                        window.location.reload();#}
                    }
                });
            }
            else{
                console.log("You should select either colors or styles or both");
            }
        }
        function addH4(val){
            screens.push(val.toLowerCase());
        }
        $(document).ready(function() {
             var target;
            $('.CisDesignToScreen').on('click', function (e) {
                target = $(e.target);
                //Delay Changing the styles and classes
                setTimeout(function() {
                    target.closest('td').find('.CisDesignToScreen').attr('style', 'top:0;position:absolute;visibility:hidden');
                    target.closest('td').find('img').attr('style', 'max-height: 136px; max-width: 100px; margin: 0;opacity:0.5;border: 2px solid orange;width: 100%;height: auto;');
                    target.closest('td').find('.CidDesignToScreen').attr('style', 'position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b400;border-radius: 50%;cursor:pointer;visibility:visible');
                    target.parents('td').eq(1).addClass('CheckedSTD');
                    $('#optionAvailability').removeClass('hidden');
                    $('#btnIdApply').removeClass('hidden');
                },20);
                checkIfAllScChecked();
            });

            $('.CidDesignToScreen').on('click', function (e) {
                target = $(e.target);
                target.closest('td').find('.CidDesignToScreen').attr('style', 'top:0;position:absolute;visibility:hidden');
                target.closest('td').find('img').attr('style', 'max-height: 136px; max-width: 100px; margin: 0;opacity:1;border: 1px solid #c1c1c159;width: 100%;height: auto;');
                target.closest('td').find('.CisDesignToScreen').attr('style', 'position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;visibility:visible');
                target.parents('td').eq(1).removeClass('CheckedSTD');
                checkIfScreenIsChecked();
            });
        });

        function checkIfAllScChecked(){
            var getAllStyle, i, checkIfAllChecked, count, style, decreaseCount;
            //Check if all screens are checked
            setTimeout(function(){
                checkIfAllChecked = $('#datatables-example-design').find('.CidDesignToScreen');
                count = 0;
                for(i=0;i<checkIfAllChecked.length;i++){
                    getAllStyle = checkIfAllChecked[i].getAttribute('style');
                    console.log(getAllStyle);
                    style = 'position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b400;border-radius: 50%;cursor:pointer;visibility:visible';
                    if (getAllStyle === style){
                        count += 1;
                        console.log('Adding 1 to the count');
                        decreaseCount = checkIfAllChecked.length - 1;
                        if (count === decreaseCount){
                            console.log('Deselect all button should appear and select all disappear');
                            $('#btnIdSelectAll').addClass('hidden');
                            $('#btnIdDeselectAll').removeClass('hidden');
                            $('#btnIdApply').removeClass('hidden');
                        } else{
                            console.log('Hide Deselect All Button');
                            $('#btnIdDeselectAll').removeClass('hidden');
                        }
                    } else{
                        console.log('Nothing done, again for loop');
                    }
                }
            },21);
        }

        function checkIfScreenIsChecked() {
            var getAllStyle, innerHTMLofVisible, innerHTMLofInvisible, checkIfChecked, i, dontCheckHiddenScreen, getAllClass;
            console.log('i am now executed');
            checkIfChecked = $('#datatables-example-design').find('.CisDesignToScreen');
            dontCheckHiddenScreen = $('#datatables-example-design').find('td');
            //Display all found class specified above
            console.log(checkIfChecked);
            for (i = 0; i < checkIfChecked.length; i++) {
                getAllStyle = checkIfChecked[i].getAttribute('style');
                getAllClass = dontCheckHiddenScreen[i].getAttribute('class');
                //Display style of all classes
                console.log(getAllStyle);
                console.log(getAllClass);
                innerHTMLofVisible = "position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;visibility:visible";
                innerHTMLofInvisible = "top:0;position:absolute;visibility:hidden";
                if (getAllClass === 'ui-sortable-handle currentlyChecked hidden') {
                    console.log('I will exit the condition and jump to "for loop condition"');
                }
                else {
                    console.log('Starting to check if screens are selected or not');
                    console.log(getAllClass);
                    if (getAllStyle === innerHTMLofVisible) {
                        console.log('All Screens are unchecked');
                        $('#btnIdNext').addClass('hidden');
                        $('#btnIdBack').removeClass('hidden');
                        $('#btnIdSelectAll').removeClass('hidden');
                        $('#btnIdDeselectAll').addClass('hidden');
                        $('#btnIdApply').addClass('hidden');
                        checkIfAllScChecked();
                    } else if (getAllStyle === innerHTMLofInvisible) {
                        console.log('One or more Screens still checked');
                        $('#btnIdNext').addClass('hidden');
                        $('#btnIdBack').removeClass('hidden');
                        $('#btnIdSelectAll').removeClass('hidden');
                        $('#btnIdApply').removeClass('hidden');
                        $('#btnIdDeselectAll').removeClass('hidden');
                        console.log('I am Breaking(Uncheck all to avoid break)');
                        break;
                    }
                }
            }
        }

            setTimeout(function(){
                $('#keepPopUpOpen').addClass('open');
            },50);

            $('.checkIconSelectedDesign').on('click', function (e) {

                    $('#optionAvailability').removeClass('hidden');

                findAllStatOfCheck = $('#datatables-example-design').find('.checkIconDeselectDesign');
                findAllStatOfUncheck = $('#datatables-example-design').find('.checkIconSelectedDesign');
                findAllImage = $('#datatables-example-design').find('.imageDesign');

                for(i = 0;i < findAllStatOfCheck.length;i++) {

                    identifyImageOutlined = findAllImage[i].getAttribute('style');
                    console.log(identifyCurrentScreen);
                    console.log(identifyImageOutlined);
                    checkedInnerHTML = 'position: absolute;width: 20px;height: 20px;z-index: 10000;left: 50%;top: 50%;transform: translate(240%,-50%);background-color: #b5b4b400;border-radius: 50%;cursor:pointer;visibility:visible';

                        if (identifyImageOutlined === imgOutlineCheck){

            $('.checkIconDeselectDesign').on('click', function (e) {

                $('#optionAvailability').addClass('hidden');

    <script>
        function collapseWorkFlow(state){
            if(state === 'up'){
                $('#btnhideWorkflw').addClass("hidden");
                $('#btnshowWorkflw').removeClass("hidden");
                $('#workFlw').addClass("hidden");
            }
            if(state === 'down'){
                $('#btnshowWorkflw').addClass("hidden");
                $('#btnhideWorkflw').removeClass("hidden");
                $('#workFlw').removeClass("hidden");
            }
        }
    </script>
