    <script>
        $(document).ready(function () {
            function readURL(input) {
                if (input.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var img = $('.imgHide');
                        img.attr('src', e.target.result);
                        img.attr('style', 'width: 100%;height: 100%;opacity: 1;max-width:90%; max-height:90%; z-index: 0;padding: 2px;border: 1px solid #1ab3946b;');
                        $('#noneOptionsAvailable').addClass('hidden');
                        var screen = $("h4[id]").length;
                        if (screen < 2 ){
                            $(document).ready(function () {
                                $('#optionSelectorOneScreen').removeClass('hidden');
                            });
                        }else {
                            $('#optionSelectorMoreScreen').removeClass('hidden');
                        }
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            }
            $('#imgUploadUploader').change(function(){
                readURL(this);
            });
        });

        function popNewUploader(){
            $('#popupNewSuggester').popup({ escape: false, blur: false, autoopen: true });
        }

        function checkForCancellation() {
            $('#popupNewSuggester').popup('hide');
            $('#allWidgets').addClass('hidden');
            $('#changeItOnUpload').attr('style', 'width: 780px;height: 330px;background-color: #f3f3f4;border-top-style: none;');
            $('#approveButtonSelect').addClass('hidden');
            $('.checkIconSelectedUpload').attr('style', 'position: absolute;width: 30%;height: 27%;z-index: 10000;left: 33%;top: 50%;transform: translate(-50%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;');
            $('.crossDisapearUpload').attr('style', 'position: absolute;width: 30%;height: 27%;z-index: 10000;left: 65%;top: 50%;transform: translate(-50%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;');
            $('.checkIconDeselectUpload').attr('style', 'visibility:hidden;');
            $('.imgHideWidgetsUpload').attr('style', 'width:100%;height:100%;opacity:1;');

        }

        function showWidgetsContainer(){
            $('#allWidgets').removeClass('hidden');
            $('#changeItOnUpload').attr('style', 'width: 780px;height: 538px;background-color: #f3f3f4;border-top-style: none;');
        }

        function selectAllScreen() {
            $('.checkIconUpload').attr('style', 'color: #18a689;margin: 12%;');
            $('.checkIconDeselectUpload').attr('style', 'position: absolute;width: 30%;height: 27%;z-index: 10000;left: 50%;top: 50%;transform: translate(-50%,-50%);background-color: #b5b4b400;border-radius: 50%;cursor:pointer');
            $('.crossDisapearUpload').attr('style', 'visibility:hidden;');
            $('.crossDisapearUpload').innerHTML = '';
            $('.checkIconSelectedUpload').attr('style', 'visibility:hidden;');
            $('.checkIconSelectedUpload').innerHTML = '';
            $('.imgHideWidgetsUpload').attr('style', 'width:100%;height:100%;opacity:0.5;');
            $('#approveButtonSelect').removeClass('hidden');
            $('#changeItOnUpload').attr('style', 'width: 780px;height: 585px;background-color: #f3f3f4;border-top-style: none;');
            $('#btnDeselect').removeClass('hidden');
            $('#btnSelect').addClass('hidden');
        }

        function deSelectAllScreen() {
            $('.crossDisapearUpload').attr('style', 'position: absolute;width: 30%;height: 27%;z-index: 10000;left: 65%;top: 50%;transform: translate(-50%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;');
            $('.crossDisapearUpload').innerHTML = '<i class="fa fa-close fa-2x" style="color: white;margin: 12%;"></i>';
            $('.checkIconSelectedUpload').attr('style', 'position: absolute;width: 30%;height: 27%;z-index: 10000;left: 33%;top: 50%;transform: translate(-50%,-50%);background-color: #b5b4b4;border-radius: 50%;cursor:pointer;');
            $('.checkIconSelectedUpload').innerHTML = '<i class="fa fa-check fa-2x" style="color: white;margin: 12%;"></i>';
            $('.checkIconDeselectUpload').attr('style', 'visibility:hidden;');
            $('.imgHideWidgetsUpload').attr('style', 'width:100%;height:100%;opacity:1;');
            $('#approveButtonSelect').addClass('hidden');
            $('#changeItOnUpload').attr('style', 'width: 780px;height: 538px;background-color: #f3f3f4;border-top-style: none;');
            $('#btnSelect').removeClass('hidden');
            $('#btnDeselect').addClass('hidden');
        }
    </script>
