{% load staticfiles %}
<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">

   <title>{% block title %}{% if page_title %}{{ page_title }} | {% endif %} Website{% endblock %}</title>

  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'font-awesome/css/font-awesome.css' %}" rel="stylesheet">

  <link href="{% static 'css/animate.css' %}" rel="stylesheet">
  <link href="{% static 'css/plugins/toastr.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <link href="{% static 'css/project.css' %}" rel="stylesheet">

</head>
<body class="gray-bg">

{% block content %}

{% endblock content %}

<script type="text/javascript">
    window.csrftoken = '{{ csrf_token }}';
</script>

<script src="{% static 'js/jquery-3.1.1.min.js' %}"></script>
<script src="{% static 'js/bootstrap.min.js' %}"></script>
<script src="{% static 'js/plugins/toastr.min.js' %}"></script>
<script src="{% static 'js/scripts_n.js' %}"></script>
<script>
    {% if messages %}
        {% for message in messages %}
           showNotifications('{{ message.tags }}', '{{ message }}');
        {% endfor %}
    {% endif %}
</script>
{% block extra_js %}

{% endblock extra_js %}

</body>
</html>
