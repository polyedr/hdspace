<!doctype html>
<html>
<head>
    {% load static %}
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">

  <title>Drag'n'Resize Demo</title>

    <link rel="stylesheet" href="{% static 'css/main.css' %}" type="text/css"/>
    <script src="{% static 'bower_components/webcomponentsjs/webcomponents.js'%}" type="text/javascript"></script>
    <link rel="import" href="{% static 'bower_components/drag-resize/drag-resize.html'%}"/>
    <style>
          body {
            position: relative;
            -webkit-user-select: none;
          }
          .content > * {
            position: absolute;
          }
        </style>
</head>
<body unresolved>

    <drag-resize></drag-resize>

    <div class="content" style="border: solid; width: 700px; height: 500px; contain: strict;">
        <div drag-resize aspectRatio = 'true'>
            this is a DIV element.
        </div>


        <span drag-resize>This is a SPAN element</span>
        <br/>
        <button drag-resize>button</button>
        <br/>
        <p drag-resize>move!</p>

      <img drag-resize width="100" height="100" src="http://3.bp.blogspot.com/-hcuqejOUpo4/Tst6wsLV_wI/AAAAAAAAASs/joUV77YuV1o/s640/cat.jpg" alt="" >


    </div>


</body>
</html>
