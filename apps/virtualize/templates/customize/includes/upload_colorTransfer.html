                <div class="panel-body" style="padding:0%;height:100%;">
                    <label for="styleImg" style="width: 100%;height: 100%;cursor: pointer;margin: 0%;border-top: 1px solid #eaedee;">

                                </div>

                                {% csrf_token %}
                                <input type="hidden" name="csrfmiddlewaretoken" value="RUa9jp8t2JEBQihtQPfisWXRY5G9b7sYIkMd0gzm4LupB8cwJcDrVJoa9Hi6RP7e">
                                <input type="file" accept="image/*" onchange="this.form.submit(),loadScreen();" name="styleImg" id="styleImg" class="input-file">

                                <label for="submit" class="submit-check" style="width: 100%;height: auto;cursor:pointer;margin-top: -9%;z-index:101;">
                                    <div class="grey-ibox-upload">

                                               border-radius: 50%;" aria-hidden="true" data-popup-ordinal="0">
                                            </i>
                                        </div>
                                    </div>
                                </label>
                            </form>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
