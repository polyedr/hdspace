    <div class="col-xs-12" style="padding:0px">
        <div class="wrapper wrapper-content" style="padding: 0px;">
            <div class="ibox" style="margin-bottom: 5px;">
                <div class="ibox-title">
                    <span>Prediction Table</span>
                </div>
                <div class="ibox-content col-xs-12" id="predictionTable" style="padding: 5px 5px 5px 5px;height:inherit;">
                    <div id="predictionMenuBarGray" style="width:100%;height: 5%;position: relative; z-index: 1;
                        left: 0px;top: 0px;">
                        <span class="w3-display-middle" style="color:#1ab394ad;text-align:center"><strong>Select an element to activate</strong></span>
                    </div>
                    <div id="databaseProjects" class="project-list" style="display: none;margin-top:-5px;">
                        <table id="datatables-example" style="margin:0px; width: 100%;">
                            <tbody>
                                <tr>
                                    <th class="project-title" style="width:25%;border-right:1px solid #ebedef;text-align:center">
                                        <a>
                                            Element
                                        </a>
                                    </th>
                                    <th class="project-title" style="width:20%;border-right:1px solid #ebedef;text-align:center">
                                        <a>
                                            Images
                                        </a>
                                    </th>
                                    <th class="project-title" style="width:30%;border-right:1px solid #ebedef;text-align:center">
                                        <a href="#">
                                            OCR Text
                                        </a>
                                    </th>
                                    <th class="project-title" style="width:25%;text-align:center">
                                        <a href="#">
                                            Other
                                        </a>
                                    </th>
                                </tr>
                                <tr style="border-top:1px solid #ebedef;">
                                    <td id="elementTypeId" style="width:25%;border-right:1px solid #ebedef;text-align:center;border-bottom: none;padding:0px">
                                        <span id="elementID">
                                            Result
                                        </span>
                                    </td>
                                    <td onclick="changeToImage()" style="width:25%;height:25%;border-right:1px solid #ebedef;text-align:center;border-bottom: none;padding:0px">
                                        <span id="imgID">
                                            <img src="/static/dirty_static/img/nopicyet.png" class="project-people" style="width:100%;text-align: left;padding:0px" />
                                        </span>
                                    </td>
                                    <td onclick="changeToOcr()" style="width:30%;border-right:1px solid #ebedef;text-align:center;border-bottom: none;padding:0px">
                                        <span id="ocrID">
                                            OCR
                                        </span>
                                    </td>
                                    <td id="changeTheElement" style="width:25%;text-align:center;border-bottom: none;padding:6px 0 0 0;">
                                        <div class="dropdown">
                                            <button class=" btn btn-default btn-sm dropbtn" style="margin-top:5px" data-toggle="dropdown" name="AddElement">
                                                <span class="fa fa-pencil-square-o"><b class="caret" style="margin-left: 5px;"></b></span>
                                            </button>
                                            <div class="dropdown-menu animated fadeInRight" type="button"
                                                style="padding:5px;min-width: 100px;margin-left: -50px;margin-top: -2px;">
                                                <form enctype="multipart/form-data" onsubmit="return finalCheck()" method="POST" name="changeElement"
                                                    style="margin:0px">
                                                    {% csrf_token %}
                                                    <input type="hidden" name="name" value="changeElement">
                                                    <input type="hidden" name="id" id="changeElementId">
                                                    <input type="radio" name="type" value="buttons"> Button<br/>
                                                    <input type="radio" name="type" value="frames"> Div<br/>
                                                    <input type="radio" name="type" value="hyperLinks"> Hyperlink<br/>
                                                    <input type="radio" name="type" value="paragraphs"> Paragraph<br/>
                                                    <input type="radio" name="type" value="pictures"> Image<br/>
                                                    <input type="radio" name="type" value="icon"> Icon<br/>
                                                    <input type="radio" name="type" value="logo"> Logo<br/>
                                                    <input type="radio" name="type" value="textArea"> Text-Area<br/>
                                                    <input type="radio" name="type" value="textBoxes"> Text-Input<br/>
                                                    <button type="submit" name="changeElement" class="btn btn-primary btn-xs"
                                                        style="width:100%;margin-top: 40px;">
                                                        Change
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>"use strict";
        $("#popupWidgetsBox").click(function(){
            $("#widgetsBox").addClass("open");
            $("#chartsBox").removeClass("open");
        });

        $("#closeWidgetsBox").click(function(){
            $("#widgetsBox").removeClass("open");
        });

        $("#popupChartsBox").click(function(){
            $("#chartsBox").addClass("open");
            $("#widgetsBox").removeClass("open");
        });

        $("#closeChartsBox").click(function(){
            $("#chartsBox").removeClass("open");
        });
    </script>
