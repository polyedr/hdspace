                                    <script>"use strict";
                                        function delTrigger(id) {
                                            {#$('#slide').popup('show');#}
                                            {#document.getElementById('idToDelte').value = id;#}
                                            swal({
                                                title: 'Do you want to delete this Screenshot?',
                                                type: 'warning',
                                                showCancelButton: true,
                                                confirmButtonColor: '#dd6b55',
                                                cancelButtonColor: '#999',
                                                confirmButtonText: 'Yes!',
                                                cancelButtonText: 'No',
                                                closeOnConfirm: false
                                            },function (isConfirm) {
                                                if (isConfirm) {
                                                    document.getElementById('idToDelte').value = id;
                                                    deletePage();
                                                    swal.close();
                                                }
                                            });

        <script>"use strict";
            $(document).ready(function () {
                var  screenCount = $('#datatables-example').find('h4').length;
                var tblwidth= 137.50*screenCount;
                document.getElementById('datatables-example').style= "width:" + tblwidth + "px; margin-bottom:0;";
            });
    </script>

    <script>"use strict";
        function deletePage() {
            var id = document.getElementById('idToDelte').value;
            $.ajax({
                type: 'POST',
                url: 'index',
                name: 'deletePage',
                data: {
                    'deletePage': id
                },
                success: function (data) {
                    var result = data;
                    console.log(result);
                },
                error: function (jqXHR, status, err) {
                    console.log(jqXHR.responseText);
                }
            });
            document.getElementById('loadingSubmitPage').style.display = '';
            location.reload();
        }
    </script>
