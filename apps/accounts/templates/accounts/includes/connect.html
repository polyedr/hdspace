{% load widget_tweaks %}
<div class="modal inmodal" id="connectTeam" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                class="sr-only">Close</span></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="input-group search_team">
            <label for="id_connect_team_name">Tema Name</label>
            <input type="text" name="team_name" data-url="{% url 'accounts:search_team' %}" autocomplete="off" placeholder="Team Name" id="id_connect_team_name" class="dropdown-toggle form-control" data-toggle="dropdown" aria-expanded="false">
            <input type="hidden" name="team_profile" id="team_profile">
            <p class="text-danger validate_error team_name_error">Please select valid team name.</p>
            <p class="text-danger validate_error team_match">No team with this name.</p>
            <ul class="dropdown-menu dropdown-menu-right" role="menu">
            </ul>
          </div>
          <div class="form-group">
            <label for="id_hourly_rate">Hourly Charge</label>
            {{ form.hourly_rate|add_class:"form-control" }}
            <p class="text-danger validate_error">This field is required.</p>
          </div>
          <div class="form-group">
            <label for="id_connect_position">Position</label>
            {{ form.connect_position|add_class:"form-control" }}
            <p class="text-danger validate_error">This field is required.</p>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="modalCloseButton"class="btn btn-white" data-dismiss="modal">Close</button>
        <button type="button" id="SaveTeamButton" class="btn btn-primary" data-url="{% url 'accounts:join_team' %}">Save</button>
      </div>
    </div>
  </div>
</div>
