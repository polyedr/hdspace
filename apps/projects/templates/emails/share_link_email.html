{% extends base_template %}
{% load staticfiles %}

{% block content %}
<tr>
  <td style="text-align: center">
    <img src="{{site_name}}{% static 'img/sar.png' %}" alt="">
    <h1 style="font-size: 31px;color: #1CC09F; margin-top: -106px;text-transform: uppercase;font-weight: bold">{{ username }} invited you to collaborate on the "{{ name }}" project</h1>

  </td>
</tr>
<tr>
  <td style="background: #ecf4f9;text-align: center;">
    <p style="color: #5D7B93;margin: 0;width: 73%;margin: 0 auto">
      <a>
        To see collaboration screen click on the button below and follow instructions.
      </a>
    </p>
  </td>
</tr>
<tr>
  <td style="background: #ecf4f9;text-align: center; height: 120px">
    <a href="{{ share_link_url }}" style="text-decoration: none;padding: 14px 35px;border-radius: 100px;border: none;cursor: pointer;background: #1CC09F;color: #ffffff;margin-top: 35px ">Screen</a>
  </td>
</tr>

{% endblock %}
